<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物志 — 共产党宣言</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}
.person-card{background:#fff;border:1px solid #e8e0d5;overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .2s}
.person-card:hover{box-shadow:0 8px 32px rgba(0,0,0,.1);transform:translateY(-2px)}
.person-card__img{aspect-ratio:3/4;overflow:hidden;background:#e8e0d5}
.person-card__img img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .4s}
.person-card:hover .person-card__img img{transform:scale(1.04)}
.person-card__body{padding:1.25rem}
.person-card__role{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#8b1a1a;display:block;margin-bottom:.4rem}
.person-card__name{font-family:Georgia,serif;font-size:1.15rem;font-weight:400;margin-bottom:.2rem}
.person-card__dates{font-size:.8rem;color:#888;margin-bottom:.6rem}
.person-card__desc{font-size:.85rem;color:#555;line-height:1.6}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;overflow-y:auto;padding:2rem 1rem}
.modal-overlay.active{display:flex;align-items:flex-start;justify-content:center}
.modal{background:#fff;max-width:820px;width:100%;margin:auto;position:relative;padding:2.5rem}
.modal__close{position:absolute;top:1rem;right:1.25rem;background:none;border:none;font-size:1.75rem;cursor:pointer;color:#999;line-height:1}
</style>
</head>
<body>
<nav class="site-nav">
<div class="site-nav__inner">

<ul class="site-nav__links">

    </button>
</div>
</nav>
<main>
<section class="section">
<div class="container">
<div class="section-header">
<span class="section-label">People</span>
<h1 class="section-title">人物志</h1>
<p class="section-desc">《共产党宣言》的作者、译者与传播者</p>
</div>
<div class="filter-bar" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:2rem">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="author">作者</button>
<button class="filter-btn" data-filter="translator">译者</button>

</div>
<div class="person-grid" id="person-grid"></div>
</div>
</section>
</main>
<div class="modal-overlay" id="modal"><div class="modal"><button class="modal__close" onclick="closeModal()">&#x2715;</button><div id="modal-body"></div></div></div>

<script>
const PEOPLE = [
{id:"marx",role:"author",name:"Karl Marx",nameZh:"卡尔·马克思",dates:"1818–1883",img:"assets/img/marx.jpg",desc:"德国哲学家、经济学家、革命家，科学社会主义创始人。",bio:"卡尔·马克思（1818年5月5日—1883年3月14日），生于普鲁士特里尔，德国哲学家、经济学家、历史学家、政治理论家、社会学家、新闻记者和革命社会主义者。马克思的思想在政治和社会科学领域产生了深远影响，他与恩格斯共同创立了科学社会主义理论体系。1848年，马克思与恩格斯共同撰写了《共产党宣言》，这部著作成为国际共产主义运动的纲领性文件。",quote:"全世界无产者，联合起来！",works:["《共产党宣言》（1848）","《资本论》（1867）","《政治经济学批判》（1859）","《德意志意识形态》（1845）","《1844年经济学哲学手稿》"]},
{id:"engels",role:"author",name:"Friedrich Engels",nameZh:"弗里德里希·恩格斯",dates:"1820–1895",img:"assets/img/engels.jpg",desc:"德国哲学家、社会科学家，马克思主义共同创始人。",bio:"弗里德里希·恩格斯（1820年11月28日—1895年8月5日），生于普鲁士巴门，德国哲学家、历史学家、政治理论家。恩格斯是卡尔·马克思的挚友和合作者，共同创立了马克思主义理论体系。他不仅在理论上与马克思并肩，还在经济上长期资助马克思的研究工作。马克思逝世后，恩格斯整理出版了《资本论》第二、三卷。",quote:"历史是这样创造的：最终的结果总是从许多单个的意志的相互冲突中产生出来的。",works:["《共产党宣言》（1848）","《反杜林论》（1878）","《家庭、私有制和国家的起源》（1884）","《自然辩证法》（1883）","《英国工人阶级状况》（1845）"]},
{id:"chen",role:"translator",name:"Chen Wangdao",nameZh:"陈望道",dates:"1891–1977",img:"assets/img/chen-wangdao.jpg",desc:"中国语言学家、教育家，《共产党宣言》首个中文全译本译者（1920）。",bio:"陈望道（1891年1月18日—1977年10月29日），浙江义乌人，中国著名语言学家、教育家、社会活动家。1920年，陈望道在家乡义乌分水塘村翻译完成《共产党宣言》，这是该著作的第一个中文全译本，对中国共产主义运动的兴起产生了深远影响。他后来成为复旦大学校长，并在中国语言学研究领域做出了重要贡献。",quote:"我是在为真理而翻译。",works:["《共产党宣言》中文全译本（1920）","《修辞学发凡》（1932）","《文法简论》（1978）","《陈望道文集》（全四卷）"]},
{id:"helen",role:"translator",name:"Helen Macfarlane",nameZh:"海伦·麦克法兰",dates:"约1818–1881",img:"assets/img/helen-macfarlane.png",desc:"英国激进主义者，《共产党宣言》首位英文译者（1850）。历史上几乎未留下肖像，此图像为AI依据历史资料生成。",bio:"海伦·麦克法兰（约1818—1881），英国激进主义者、哲学家和记者。1850年，她将《共产党宣言》译成英文，发表于《红色共和党人》杂志，这是该著作的第一个英文译本。她的翻译工作长期被历史所忽视，直到20世纪才重新获得学界关注。历史上极少留有关于她的记录，亦无已知肖像存世。本图为AI根据历史背景生成的艺术复原像。",quote:"一个幽灵，共产主义的幽灵，在欧洲游荡。",works:["《共产党宣言》英文首译（1850）","《红色共和党人》系列文章"]},
{id:"samuel",role:"translator",name:"Samuel Moore",nameZh:"塞缪尔·摩尔",dates:"1838–1911",img:"assets/img/samuel-moore.png",desc:"英国律师，与恩格斯合作完成权威英文译本（1888）。无已知肖像存世，此图像为AI依据历史资料生成。",bio:"塞缪尔·摩尔（1838—1911），英国律师，马克思的朋友。1888年，他与弗里德里希·恩格斯合作翻译了《共产党宣言》的权威英文版本，该版本至今仍是最广泛使用的英文译本之一。摩尔还翻译了马克思《资本论》第一卷的部分内容。无已知肖像存世，本图为AI根据历史背景生成的艺术复原像。",quote:"",works:["《共产党宣言》英文权威译本（1888，与恩格斯合译）","《资本论》第一卷英译（部分）"]},
{id:"vera",role:"translator",name:"Vera Zasulich",nameZh:"薇拉·查苏利奇",dates:"1849–1919",img:"assets/img/vera-zasulich.jpg",desc:"俄国革命家，参与《共产党宣言》俄文版传播工作。",bio:"薇拉·查苏利奇（1849—1919），俄国革命家、马克思主义者。她是普列汉诺夫领导的劳动解放社成员，积极参与马克思主义著作的俄文翻译和传播工作，对俄国社会民主主义运动的兴起做出了重要贡献。",quote:"",works:["参与《共产党宣言》俄文版传播","《革命的无政府主义》"]},
{id:"plekhanov",role:"translator",name:"Georgi Plekhanov",nameZh:"格奥尔基·普列汉诺夫",dates:"1856–1918",img:"assets/img/plekhanov.jpg",desc:"俄国马克思主义之父，参与《共产党宣言》俄文版翻译工作。",bio:"格奥尔基·普列汉诺夫（1856—1918），俄国革命家、哲学家，被誉为俄国马克思主义之父。他是劳动解放社的创始人，将马克思主义系统引入俄国，并参与了《共产党宣言》俄文版的翻译和传播工作。",quote:"没有革命理论，就没有革命运动。",works:["《社会主义与政治斗争》（1883）","《我们的分歧》（1885）","参与《共产党宣言》俄文版传播"]},
{id:"laura",role:"translator",name:"Laura Lafargue",nameZh:"劳拉·拉法格",dates:"1845–1911",img:"assets/img/laura-lafargue.jpg",desc:"马克思之女，《共产党宣言》法文译者（1872）。",bio:"劳拉·马克思·拉法格（1845—1911），卡尔·马克思的次女，法国社会主义活动家。1872年，她与丈夫保罗·拉法格合作将《共产党宣言》译成法文，在巴黎《社会主义者》杂志连载。",quote:"我们选择在意识清醒、力量尚存时离开。",works:["《共产党宣言》法文译本（1872，与保罗·拉法格合译）"]}
];

const grid = document.getElementById('person-grid');
const modal = document.getElementById('modal');
const modalBody = document.getElementById('modal-body');

function renderGrid(filter) {
  const items = filter === 'all' ? PEOPLE : PEOPLE.filter(p => p.role === filter);
  grid.innerHTML = items.map(p => `
    <div class="person-card" onclick="openModal('${p.id}')" tabindex="0" role="button" aria-label="${p.nameZh}">
      <div class="person-card__img">${p.img ? `<img src="${p.img}" alt="${p.nameZh}" loading="lazy">` : '<div style="width:100%;height:100%;background:#d4c9b8;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#999">&#9786;</div>'}</div>
      <div class="person-card__body">
        <span class="person-card__role">${p.role === 'author' ? '作者' : p.role === 'translator' ? '译者' : '出版者'}</span>
        <h3 class="person-card__name">${p.nameZh}</h3>
        <div class="person-card__dates">${p.dates}</div>
        <p class="person-card__desc">${p.desc}</p>
      </div>
    </div>`).join('');
}
function openModal(id) {
  const p = PEOPLE.find(x => x.id === id);
  if (!p) return;
  const works = p.works.map(w => `<li>${w}</li>`).join('');
  modalBody.innerHTML = `
    <div style="display:flex;gap:2rem;flex-wrap:wrap">
      <div style="flex:0 0 200px">${p.img ? `<img src="${p.img}" alt="${p.nameZh}" style="width:100%;display:block">` : '<div style="width:200px;height:260px;background:#e8e0d5;display:flex;align-items:center;justify-content:center;font-size:4rem;color:#bbb">&#9786;</div>'}</div>
      <div style="flex:1;min-width:200px">
        <span style="font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:#8b1a1a">${p.role === 'author' ? '作者' : p.role === 'translator' ? '译者' : '出版者'}</span>
        <h2 style="font-family:Georgia,serif;font-size:1.75rem;margin:.5rem 0 .25rem">${p.nameZh}</h2>
        <p style="color:#888;margin-bottom:1rem">${p.name} &nbsp;${p.dates}</p>
        <p style="line-height:1.8;color:#333;margin-bottom:1.5rem">${p.bio}</p>
        <h4 style="font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem">主要著作</h4>
        <ul style="padding-left:1.25rem;color:#555;line-height:2">${works}</ul>
      </div>
    </div>`;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modal.classList.remove('active');
  document.body.style.overflow = '';
}
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid(btn.dataset.filter);
  });
});
renderGrid('all');
</script>
<script>
(function(){
  var btn=document.getElementById('nav-toggle');
  var links=document.querySelector('.site-nav__links');
  if(btn&&links){btn.addEventListener('click',function(){
    var open=links.classList.toggle('is-open');
    btn.classList.toggle('is-open',open);
    btn.setAttribute('aria-expanded',open);
  });}
})();
</script>
</body>
</html>
