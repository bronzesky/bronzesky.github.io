<style>
.vlib-hero{background:#1a1a1a;color:#fff;padding:4rem 0 3rem;text-align:center}
.vlib-hero__label{font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:1rem}
.vlib-hero__title{font-family:"Noto Serif SC",Georgia,serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:700;margin-bottom:.75rem}
.vlib-hero__sub{color:rgba(255,255,255,.55);font-size:.95rem;max-width:500px;margin:0 auto}
.vlib-stats{display:flex;justify-content:center;gap:3rem;margin-top:2rem;flex-wrap:wrap}
.vlib-stat__num{font-family:Georgia,serif;font-size:2rem;font-weight:700;color:#c0392b}
.vlib-stat__label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:.25rem}
.filter-wrap{background:#f5f0eb;border-bottom:1px solid #e8e0d5;padding:.75rem 0;position:sticky;top:60px;z-index:10}
.filter-inner{display:flex;gap:.5rem;overflow-x:auto;padding:0 1.5rem;scrollbar-width:none}
.filter-inner::-webkit-scrollbar{display:none}
.fbtn{background:none;border:1px solid #ccc;padding:.4rem 1rem;font-size:.78rem;letter-spacing:.06em;cursor:pointer;white-space:nowrap;transition:all .2s;border-radius:2px}
.fbtn.active,.fbtn:hover{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.books-section{padding:3rem 0}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.5rem;margin-top:2rem}
.book-card{cursor:pointer;transition:transform .2s;position:relative}
.book-card:hover{transform:translateY(-4px)}
.book-cover{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;box-shadow:4px 6px 20px rgba(0,0,0,.25);border-radius:2px}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover-bg{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:1rem .75rem;position:relative}
.book-cover-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.7) 100%)}
.book-cover-title{position:relative;z-index:1;font-family:Georgia,serif;font-size:.85rem;font-weight:700;color:#fff;line-height:1.3;margin-bottom:.25rem}
.book-cover-year{position:relative;z-index:1;font-size:.7rem;color:rgba(255,255,255,.7);letter-spacing:.05em}
.book-lang-badge{position:absolute;top:.5rem;right:.5rem;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;padding:.2rem .4rem;border-radius:2px;backdrop-filter:blur(4px)}
.book-info{padding:.6rem .25rem 0}
.book-info__title{font-size:.82rem;font-weight:600;color:#1a1a1a;line-height:1.3;margin-bottom:.2rem}
.book-info__meta{font-size:.72rem;color:#888}
.book-new-badge{position:absolute;top:.5rem;left:.5rem;background:#c0392b;color:#fff;font-size:.65rem;padding:.15rem .4rem;letter-spacing:.05em;text-transform:uppercase}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;position:relative;border-radius:2px}
.modal-inner{display:grid;grid-template-columns:200px 1fr;gap:0}
@media(max-width:600px){.modal-inner{grid-template-columns:1fr}.modal-cover-col{display:none}}
.modal-cover-col{background:#f5f0eb;padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.modal-cover-img{width:140px;aspect-ratio:2/3;object-fit:cover;box-shadow:4px 6px 20px rgba(0,0,0,.2)}
.modal-cover-bg{width:140px;aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:flex-end;padding:.75rem;box-shadow:4px 6px 20px rgba(0,0,0,.2)}
.modal-dl-btn{display:block;width:100%;text-align:center;background:#c0392b;color:#fff;padding:.6rem;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:background .2s}
.modal-dl-btn:hover{background:#a93226}
.modal-body-col{padding:2rem}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#666;z-index:1}
.modal-lang-tag{display:inline-block;background:#f0ebe3;color:#666;font-size:.7rem;padding:.2rem .6rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem}
.modal-title{font-family:"Noto Serif SC",Georgia,serif;font-size:1.4rem;font-weight:700;color:#1a1a1a;margin-bottom:.25rem;line-height:1.3}
.modal-year{font-size:.85rem;color:#c0392b;font-weight:600;margin-bottom:1rem}
.modal-desc{font-size:.88rem;color:#444;line-height:1.7;margin-bottom:1.25rem}
.modal-facts{border-top:1px solid #eee;padding-top:1rem}
.modal-fact{display:flex;gap:.75rem;margin-bottom:.5rem;font-size:.82rem}
.modal-fact__key{color:#999;min-width:70px;flex-shrink:0}
.modal-fact__val{color:#333}
.section-label-sm{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#999;margin-bottom:.5rem}
@media(max-width:768px){.books-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem}}
</style>

function renderBooks(list) {
  const grid = document.getElementById('booksGrid');
  grid.innerHTML = list.map(b => {
    const coverHtml = b.cover
      ? `<img src="${b.cover}" alt="${b.title}" loading="lazy">`
      : `<div class="book-cover-bg" style="background:${b.color||'#1a1a1a'}">
           <div class="book-cover-title">${b.title}</div>
           <div class="book-cover-year">${b.year}</div>
         </div>`;
    return `<div class="book-card" onclick="openModal('${b.id}')">
      <div class="book-cover">
        ${coverHtml}
        <span class="book-lang-badge">${b.flag||''}</span>
        ${b.isNew ? '<span class="book-new-badge">精选</span>' : ''}
      </div>
      <div class="book-info">
        <div class="book-info__title">${b.titleLocal||b.title}</div>
        <div class="book-info__meta">${b.year} · ${b.place||''}</div>
      </div>
    </div>`;
  }).join('');
}
function filterBooks(lang) {
  document.querySelectorAll('.fbtn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === lang));
  const filtered = lang === 'all' ? VERSIONS : VERSIONS.filter(b => b.lang === lang);
  renderBooks(filtered);
}
function openModal(id) {
  const b = VERSIONS.find(v => v.id === id);
  if (!b) return;

    ? `<img class="modal-cover-img" src="${b.cover}" alt="${b.title}">`
    : `<div class="modal-cover-bg" style="background:${b.color||'#1a1a1a'}">
         <div class="book-cover-title">${b.title}</div>
         <div class="book-cover-year">${b.year}</div>
       </div>`;
  document.getElementById('modalCoverWrap').innerHTML = coverHtml;
  document.getElementById('modalDlWrap').innerHTML = '';
  document.getElementById('modalLangTag').textContent = b.langLabel || b.lang;
  document.getElementById('modalTitle').textContent = b.titleLocal || b.title;
  document.getElementById('modalYear').textContent = `${b.year}年 · ${b.place||''} · ${b.publisher||''}`;
  document.getElementById('modalDesc').textContent = b.desc || '';
  const factsHtml = (b.facts||[]).map(f =>
    `<tr><td style="color:#888;padding:.3rem .5rem .3rem 0;font-size:.8rem;white-space:nowrap">${f.k}</td>
         <td style="padding:.3rem 0;font-size:.85rem">${f.v}</td></tr>`
  ).join('');
  document.getElementById('modalFacts').innerHTML = factsHtml
    ? `<table style="width:100%;border-collapse:collapse">${factsHtml}</table>` : '';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('DOMContentLoaded', () => {
  renderBooks(VERSIONS);
  document.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => filterBooks(btn.dataset.filter));
  });
});
</script>
